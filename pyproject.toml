[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "WFM4Cities"
dynamic = ["version"]
description = "DEM-inspired urban scalar surfaces and progressive threshold scanning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Zuo Zhang" },
  { name = "Yukun Jiang", email = "jiangyukunccnu@163.com" },
  { name = "Zhe Wang" },
]
keywords = [
  "urban morphology",
  "progressive threshold scanning",
  "scalar surface",
  "spatial analysis",
  "DEM-inspired",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
spatial = [
  "geopandas>=0.13,<2",
  "shapely>=2,<3",
  "libpysal>=4.13.0,<5",
  "esda>=2.5,<3",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "twine>=5",
]

[project.scripts]
wfm4cities = "wfm4cities.cli:main"
WFM4Cities = "wfm4cities.cli:main"

[project.urls]
Homepage = "https://github.com/zhangzuocughustccnu/WFM4Cities"
Repository = "https://github.com/zhangzuocughustccnu/WFM4Cities.git"
Issues = "https://github.com/zhangzuocughustccnu/WFM4Cities/issues"
Changelog = "https://github.com/zhangzuocughustccnu/WFM4Cities/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "wfm4cities._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wfm4cities"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B905"]
